```html
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Camper V5</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Koulen&family=Moul&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- =========================
         LEFT PANEL
    ========================== -->

    <div class="left-panel">

        <h2>📝 Text Editor</h2>

        <label>ជ្រើស Template</label>
        <select id="templateSelect">
            <option value="ក្រហម.png">ក្រហម</option>
            <option value="បៃតង.png">បៃតង</option>
            <option value="លឿង.png">លឿង</option>
            <option value="ស្វាយ.png">ស្វាយ</option>
            <option value="ផ្កាឈូក.png">ផ្កាឈូក</option>
            <option value="ខៀវ.png">ខៀវ</option>
        </select>

        <label>ឈ្មោះអ្នកទទួល</label>
        <input
            type="text"
            id="recipientName"
            placeholder="បញ្ចូលឈ្មោះ">

        <label>មូលហេតុទទួលវិញ្ញាបនបត្រ</label>
        <textarea
            id="reason"
            rows="4"
            placeholder="បញ្ចូលមូលហេតុ"></textarea>

        <label>ពណ៌ក្រុម</label>
        <input
            type="text"
            id="groupColor"
            placeholder="ឧ. ក្រុមបៃតង">

        <hr>

        <label>កែសម្រួលអត្ថបទ</label>

        <select id="textTarget">
            <option value="name">ឈ្មោះ</option>
            <option value="reason">មូលហេតុ</option>
            <option value="group">ក្រុម</option>
        </select>

        <label>Font</label>
        <select id="fontFamily">
            <option value="Battambang">Battambang</option>
            <option value="Koulen">Koulen</option>
            <option value="Moul">Moul</option>
        </select>

        <label>Font Size</label>
        <input
            type="range"
            id="fontSize"
            min="12"
            max="100"
            value="48">

        <label>Text Color</label>
        <input
            type="color"
            id="textColor"
            value="#ffffff">

        <label>Shadow Color</label>
        <input
            type="color"
            id="shadowColor"
            value="#000000">

        <div class="check-group">
            <label>
                <input type="checkbox" id="boldToggle">
                Bold
            </label>
        </div>

        <div class="check-group">
            <label>
                <input type="checkbox" id="italicToggle">
                Italic
            </label>
        </div>

        <label>X Position</label>
        <input
            type="range"
            id="textX"
            min="0"
            max="100"
            value="50">

        <label>Y Position</label>
        <input
            type="range"
            id="textY"
            min="0"
            max="1100"
            value="500">

    </div>

    <!-- =========================
         CENTER PREVIEW
    ========================== -->

    <div class="preview-wrapper">

        <div id="certificate">

            <img
                id="photoPreview"
                class="photo-preview"
                alt="photo">

            <div
                id="namePreview"
                class="name-preview draggable">
                ឈ្មោះអ្នកទទួល
            </div>

            <div
                id="reasonPreview"
                class="reason-preview draggable">
                មូលហេតុទទួលវិញ្ញាបនបត្រ
            </div>

            <div
                id="groupPreview"
                class="group-preview draggable">
                ក្រុម
            </div>

        </div>

    </div>

    <!-- =========================
         RIGHT PANEL
    ========================== -->

    <div class="right-panel">

        <h2>📷 Photo Editor</h2>

        <label>Upload Photo</label>
        <input
            type="file"
            id="photoInput"
            accept="image/*">

        <label>Photo Size</label>
        <input
            type="range"
            id="photoSize"
            min="80"
            max="400"
            value="150">

        <label>Photo X</label>
        <input
            type="range"
            id="photoX"
            min="0"
            max="700"
            value="330">

        <label>Photo Y</label>
        <input
            type="range"
            id="photoY"
            min="0"
            max="1000"
            value="300">

        <hr>

        <h2>⬇ Export</h2>

        <button id="downloadPNG">
            Download PNG
        </button>

        <button id="downloadPDF">
            Download PDF
        </button>

        <button onclick="window.print()">
            Print
        </button>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
```
