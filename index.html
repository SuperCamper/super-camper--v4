```html
<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Camper Studio V7</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Koulen&family=Moul&display=swap" rel="stylesheet">

</head>
<body>

<!-- ==================================
     TOP TOOLBAR
=================================== -->

<header class="toolbar">

    <div class="toolbar-left">

        <h1>🏕️ Super Camper Studio V7</h1>

    </div>

    <div class="toolbar-right">

        <button id="undoBtn">↶ Undo</button>

        <button id="redoBtn">↷ Redo</button>

        <button id="saveBtn">💾 Save</button>

        <button id="loadBtn">📂 Load</button>

        <button id="downloadPNG">🖼 PNG</button>

        <button id="downloadPDF">📄 PDF</button>

        <button id="printBtn">🖨 Print</button>

    </div>

</header>

<!-- ==================================
     MAIN LAYOUT
=================================== -->

<div class="studio-layout">

    <!-- ==========================
         LEFT SIDEBAR
    =========================== -->

    <aside class="sidebar">

        <div class="panel-card">

            <h3>🎨 Templates</h3>

            <select id="templateSelect">

                <option value="templates/ក្រហម.png">ក្រហម</option>
                <option value="templates/បៃតង.png">បៃតង</option>
                <option value="templates/លឿង.png">លឿង</option>
                <option value="templates/ស្វាយ.png">ស្វាយ</option>
                <option value="templates/ផ្កាឈូក.png">ផ្កាឈូក</option>
                <option value="templates/ខៀវ.png">ខៀវ</option>

            </select>

        </div>

        <div class="panel-card">

            <h3>🖼 Background</h3>

            <input
                type="file"
                id="backgroundUpload"
                accept="image/png,image/jpeg,image/jpg">

        </div>

        <div class="panel-card">

            <h3>📷 Photo</h3>

            <input
                type="file"
                id="photoInput"
                accept="image/*">

        </div>

        <div class="panel-card">

            <h3>📝 Text</h3>

            <input
                type="text"
                id="recipientName"
                placeholder="ឈ្មោះអ្នកទទួល">

            <textarea
                id="reason"
                rows="4"
                placeholder="មូលហេតុ"></textarea>

            <input
                type="text"
                id="groupColor"
                placeholder="ក្រុម">

        </div>

        <div class="panel-card">

            <h3>📚 Layers</h3>

            <ul class="layers-list">

                <li>Name</li>
                <li>Reason</li>
                <li>Group</li>
                <li>Photo</li>

            </ul>

        </div>

    </aside>

    <!-- ==========================
         CENTER CANVAS
    =========================== -->

    <main class="canvas-wrapper">

        <div id="certificate">

            <img
                id="photoPreview"
                class="photo-preview"
                alt="photo">

            <div
                id="namePreview"
                class="name-preview draggable">

                ឈ្មោះអ្នកទទួល

            </div>

            <div
                id="reasonPreview"
                class="reason-preview draggable">

                មូលហេតុទទួលវិញ្ញាបនបត្រ

            </div>

            <div
                id="groupPreview"
                class="group-preview draggable">

                ក្រុម

            </div>

        </div>

    </main>

    <!-- ==========================
         RIGHT PROPERTIES
    =========================== -->

    <aside class="properties">

        <div class="panel-card">

            <h3>🔧 Text Settings</h3>

            <label>Selected Text</label>

            <select id="targetText">

                <option value="name">Name</option>
                <option value="reason">Reason</option>
                <option value="group">Group</option>

            </select>

            <label>Font Family</label>

            <select id="fontFamily">

                <option value="Battambang">Battambang</option>
                <option value="Koulen">Koulen</option>
                <option value="Moul">Moul</option>
                <option value="Arial">Arial</option>
                <option value="Tahoma">Tahoma</option>

            </select>

            <label>Font Size</label>

            <input
                type="range"
                id="fontSize"
                min="12"
                max="120"
                value="48">

            <label>Text Color</label>

            <input
                type="color"
                id="textColor"
                value="#ffffff">

            <label>Shadow Color</label>

            <input
                type="color"
                id="shadowColor"
                value="#000000">

            <div class="checkbox-row">

                <label>
                    <input type="checkbox" id="boldText">
                    Bold
                </label>

                <label>
                    <input type="checkbox" id="italicText">
                    Italic
                </label>

            </div>

        </div>

        <div class="panel-card">

            <h3>📷 Photo Settings</h3>

            <label>Photo Size</label>

            <input
                type="range"
                id="photoSize"
                min="50"
                max="400"
                value="140">

            <label>Border Radius</label>

            <input
                type="range"
                id="photoRadius"
                min="0"
                max="100"
                value="12">

        </div>

        <div class="panel-card">

            <h3>📍 Position</h3>

            <label>X Position</label>

            <input
                type="range"
                id="textX"
                min="0"
                max="794"
                value="250">

            <label>Y Position</label>

            <input
                type="range"
                id="textY"
                min="0"
                max="1123"
                value="500">

        </div>

    </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
```
